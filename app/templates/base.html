<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Result Platform{% endblock %}</title>
  <!--
    Styles are inline on purpose so the page looks good with no external files.
    Two layouts: a centered "card" (for login) and a wider "dashboard" page.
  -->
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #eef1ff 0%, #f6f7fb 100%);
      min-height: 100vh; color: #2d3142;
    }

    /* ---- Centered card (login) ---- */
    .center-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
    .card {
      background:#fff; border-radius:18px; padding:40px;
      box-shadow:0 12px 40px rgba(60,70,120,0.12); width:100%; max-width:420px;
    }

    /* ---- Dashboard layout ---- */
    .topbar {
      background:#fff; box-shadow:0 2px 12px rgba(60,70,120,0.06);
      padding:16px 28px; display:flex; align-items:center; justify-content:space-between;
    }
    .brand { font-weight:800; font-size:1.15rem; color:#3b45c4; }
    .topbar .userbox { display:flex; align-items:center; gap:14px; font-size:0.9rem; color:#5b6079; }
    .container { max-width:1000px; margin:0 auto; padding:32px 24px; }

    h1 { font-size:1.7rem; margin-bottom:6px; color:#3a3f58; }
    .subtitle { color:#6b7089; margin-bottom:6px; }
    p { line-height:1.6; color:#5b6079; }

    .role-badge {
      display:inline-block; background:linear-gradient(135deg,#5b6ef5,#8b5cf6);
      color:#fff; padding:5px 14px; border-radius:30px; font-weight:700; font-size:0.82rem;
    }

    /* card grid */
    .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:18px; margin-top:26px; }
    .dash-card {
      background:#fff; border-radius:16px; padding:24px; box-shadow:0 6px 24px rgba(60,70,120,0.08);
      border:1px solid #eef0f7; transition:transform .15s, box-shadow .15s;
    }
    .dash-card:hover { transform:translateY(-3px); box-shadow:0 12px 30px rgba(60,70,120,0.14); }
    .dash-card .icon { font-size:2rem; }
    .dash-card .label { font-weight:700; font-size:1.1rem; margin:10px 0 4px; color:#3a3f58; }
    .dash-card .desc { font-size:0.9rem; color:#6b7089; }
    .soon { font-size:0.72rem; background:#fff4e5; color:#b5730f; padding:2px 8px; border-radius:20px; font-weight:700; }

    /* forms (login) */
    label { display:block; margin:14px 0 4px; font-weight:600; color:#4b4f6b; font-size:0.9rem; }
    input {
      width:100%; padding:11px 14px; border:1.5px solid #d7dcf0; border-radius:10px; font-size:1rem;
    }
    input:focus { outline:none; border-color:#5b6ef5; }
    .btn {
      display:inline-block; padding:10px 18px; background:linear-gradient(135deg,#5b6ef5,#8b5cf6);
      color:#fff; border:none; border-radius:10px; font-size:0.95rem; font-weight:700;
      cursor:pointer; text-align:center; text-decoration:none;
    }
    .btn:hover { opacity:.92; }
    .btn-block { width:100%; margin-top:20px; padding:12px; }
    .btn-light { background:#f0f2fa; color:#5b6ef5; padding:8px 16px; }
    .error { color:#c0392b; background:#fdeaea; padding:10px 14px; border-radius:8px; margin:10px 0; font-size:0.9rem; }
    .muted { color:#9aa0bd; font-size:0.85rem; }
  </style>
</head>
<body>
  {% block body %}{% endblock %}
</body>
</html>
