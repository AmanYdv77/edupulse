<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>403 - Forbidden | EduPulse</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/error.css' %}">
</head>
<body>
  <main class="error-card">
    <div class="error-code">403</div>
    <h1 class="error-title">Access Forbidden</h1>
    <p class="error-message">You do not have the required permissions or institutional scope to access this resource.</p>
    <div class="error-actions">
      <a href="/app/" class="btn btn-primary">Return to Application</a>
    </div>
  </main>
</body>
</html>
