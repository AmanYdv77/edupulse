<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>400 - Bad Request | EduPulse</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/error.css' %}">
</head>
<body>
  <main class="error-card">
    <div class="error-code">400</div>
    <h1 class="error-title">Bad Request</h1>
    <p class="error-message">The request could not be understood by the server due to malformed syntax or invalid parameters.</p>
    <div class="error-actions">
      <a href="/app/" class="btn btn-primary">Return to Application</a>
    </div>
  </main>
</body>
</html>
