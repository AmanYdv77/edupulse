<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | EduPulse</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/error.css' %}">
</head>
<body>
  <main class="error-card">
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-message">The requested page or endpoint does not exist or has been moved to the single-page application.</p>
    <div class="error-actions">
      <a href="/app/" class="btn btn-primary">Return to Application</a>
    </div>
  </main>
</body>
</html>
