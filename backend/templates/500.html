<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>500 - Server Error | EduPulse</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/error.css' %}">
</head>
<body>
  <main class="error-card">
    <div class="error-code">500</div>
    <h1 class="error-title">Internal Server Error</h1>
    <p class="error-message">An unexpected error occurred while processing your request. The engineering team has been notified.</p>
    <div class="error-actions">
      <a href="/app/" class="btn btn-primary">Return to Application</a>
    </div>
  </main>
</body>
</html>
